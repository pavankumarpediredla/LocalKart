spring.application.name=commerce

server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/commerce_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Pavan@0037}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.jakarta.persistence.jdbc.url=${spring.datasource.url}
spring.jpa.properties.jakarta.persistence.jdbc.user=${spring.datasource.username}
spring.jpa.properties.jakarta.persistence.jdbc.password=${spring.datasource.password}
spring.jpa.properties.jakarta.persistence.jdbc.driver=${spring.datasource.driver-class-name}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

app.firebase.enabled=${FIREBASE_ENABLED:false}
app.firebase.bucket-name=${FIREBASE_BUCKET_NAME:}
app.firebase.credentials-path=${FIREBASE_CREDENTIALS_PATH:}
app.storage.upload-dir=${APP_UPLOAD_DIR:uploads}

app.bootstrap-admin.username=${BOOTSTRAP_ADMIN_USERNAME:admin}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:admin123}
app.bootstrap-admin.full-name=${BOOTSTRAP_ADMIN_FULL_NAME:Platform Admin}
app.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:admin@easycart.com}
app.bootstrap-admin.customer.username=${BOOTSTRAP_CUSTOMER_USERNAME:testCustomer}
app.bootstrap-admin.customer.password=${BOOTSTRAP_CUSTOMER_PASSWORD:customer123}
app.bootstrap-admin.customer.full-name=${BOOTSTRAP_CUSTOMER_FULL_NAME:Default Customer}
app.bootstrap-admin.customer.email=${BOOTSTRAP_CUSTOMER_EMAIL:customer@easycart.com}
